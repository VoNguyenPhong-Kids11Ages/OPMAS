name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:sources
      - run: pnpm build:db
      - run: pnpm validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm release:web
      - name: Upload built userscript
        uses: actions/upload-artifact@v4
        with:
          name: opmas-userscript
          path: apps/userscript/dist/opmas.user.js
          if-no-files-found: error
          retention-days: 14
      - name: Upload built website
        uses: actions/upload-artifact@v4
        with:
          name: opmas-website
          path: apps/website/dist/
          if-no-files-found: error
          retention-days: 14
      - run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
